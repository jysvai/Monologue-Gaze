<!-- GitHub Pages 가 없는 주소에서 보여 주는 쪽. 게임 파일 없이 혼자 선다 (글꼴은 기기 글꼴) -->
<style>
  :root{--desk:#1c1815;--paper:#ece2c6;--ink:#26303f;--pencil:#7a7466;--red:#b0342a}
  *{box-sizing:border-box}
  html,body{height:100%}
  body{margin:0;display:grid;place-items:center;padding:16px;background:var(--desk) radial-gradient(ellipse at 28% 18%,#3a3029 0%,transparent 62%);color:var(--ink);font:15px/1.7 "Nanum Gothic","Apple SD Gothic Neo","Malgun Gothic",sans-serif;word-break:keep-all}
  .slip{position:relative;max-width:26em;padding:26px 26px 22px;background:var(--paper);box-shadow:0 14px 30px rgba(0,0,0,.5);transform:rotate(-.8deg)}
  .no{margin:0 0 6px;padding-right:58px;font:12px/1.4 ui-monospace,Consolas,monospace;letter-spacing:.14em;color:var(--pencil)}
  h1{margin:0 0 10px;font:700 22px/1.3 "Nanum Myeongjo","AppleMyungjo","Batang",serif}
  p{margin:0 0 14px}
  .stamp{position:absolute;right:18px;top:16px;padding:2px 8px;border:2px solid var(--red);border-radius:3px;color:var(--red);font:700 13px/1.4 "Nanum Gothic",sans-serif;letter-spacing:.1em;transform:rotate(8deg);opacity:.8}
  a{display:inline-block;padding:6px 16px 5px;background:var(--ink);color:var(--paper);text-decoration:none;border-radius:2px}
  a:focus-visible{outline:2px solid var(--red);outline-offset:3px}
</style>
</head>
<body>
<main class="slip">
  <span class="stamp" aria-hidden="true">없음</span>
  <p class="no">서울서부경찰서 강력2팀 · 미제사건 기록실</p>
  <h1>찾는 기록이 서랍에 없습니다</h1>
  <p>주소가 바뀌었거나 잘못 적힌 것 같습니다. 기록실로 돌아가면 하던 수사는 그대로 이어집니다.</p>
  <a href="/Monologue-Gaze/">기록실로 가기</a>
</main>
</body>
</html>
