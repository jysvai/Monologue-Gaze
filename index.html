<script>
(function () {
  function start(data) {
    again(function () {
      try { window.MG.I18N.ready(function () { boot(data); }); } catch (e) { boot(data); } // 고른 언어의 꾸러미를 받은 뒤에 연다
    });
  }
  // 받다가 끊긴 사건 파일은 주소 끝을 바꿔 한 번 더 받는다 (서랍에 사건 몇 개가 통째로 빠진 채 열리지 않게)
  function again(cb) {
    var miss = [];
    try {
      Array.prototype.forEach.call(document.querySelectorAll('script[src^="cases/"]'), function (t) {
        var m = /cases\/(c\d+)-/.exec(t.getAttribute('src'));
        if (m && !window.MG.byId[m[1]]) miss.push(t.getAttribute('src'));
      });
    } catch (e) { return cb(); }
    var left = miss.length;
    if (!left) return cb();
    var fired = false, go = function () { if (!fired) { fired = true; cb(); } };
    miss.forEach(function (src) {
      var s = document.createElement('script');
      s.src = src + '?r=' + Date.now();
      s.onload = s.onerror = function () { if (--left <= 0) go(); };
      document.head.appendChild(s);
    });
    setTimeout(go, 15000);
  }
  function boot(data) {
    try { window.MG.boot(data); } catch (e) { // 사건 파일 하나가 잘못 받아졌어도 빈 책상만 남기지 않는다
      var a = document.getElementById('app');
      if (a) a.innerHTML = '<p class="nojs">' + window.MG.T('서랍이 걸려 열리지 않는다.<br>새로 고침을 눌러 다시 열어 본다. 그래도 걸리면 조금 있다가 다시 연다.') + '</p>';
      if (window.console) console.error(e);
    }
  }
  try { window.claude && window.claude.hot && window.claude.hot.snapshot && window.claude.hot.snapshot(function () { return { S: window.MG.state() }; }); } catch (e) {}
  if (window.claude && window.claude.hot && window.claude.hot.ready) window.claude.hot.ready(start);
  else start((window.claude && window.claude.hot && window.claude.hot.data) || {});
})();
</script>
